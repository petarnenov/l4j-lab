services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: l4j
      POSTGRES_USER: l4j
      POSTGRES_PASSWORD: l4j
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U l4j"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Local provider mode. Cloud mode needs neither this service nor a pulled model.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama

volumes:
  pgdata:
  ollamadata:
