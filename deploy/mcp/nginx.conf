# Feature 007: round-robin over three identical MCP replicas.
#
# The whole point of FR-007 is that any replica can answer any request. Round-robin with no
# stickiness is what makes that testable: a cursor minted by mcp-a lands on mcp-b on the next call
# whether the test asks for it or not.
worker_processes 1;
events { worker_connections 1024; }

http {
    upstream mcp_replicas {
        # No ip_hash, no sticky cookie, no least_conn. Deliberately the dumbest possible balancer.
        server mcp-a:8080;
        server mcp-b:8080;
        server mcp-c:8080;
    }

    upstream issuer {
        server token-issuer:8080;
    }

    server {
        listen 8080;

        # Every method on /mcp reaches the application, not only POST. GET and DELETE must get the
        # application's own 405 (FR-006): if nginx answered them, the conformance test would be
        # testing nginx.
        location /mcp {
            proxy_pass http://mcp_replicas;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            # SSE responses must not be buffered, or a streamed result arrives all at once.
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # The issuer, through the same published port, so the stack needs only one (research.md
        # R-005). Development-only, like the issuer itself.
        location /dev/ {
            proxy_pass http://issuer;
            proxy_set_header Host $host;
        }

        location /.well-known/ {
            proxy_pass http://issuer;
            proxy_set_header Host $host;
        }

        location /lb-health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
