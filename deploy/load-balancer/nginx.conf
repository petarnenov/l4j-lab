# The load balancer for the packaged system (feature 004). It is the only container with a published
# port. Every decision below is listed, with its reason, in
# specs/004-containerized-deployment/contracts/load-balancer.md.

worker_processes auto;
# The container runs as the unprivileged nginx user, so every file nginx writes lives under /tmp.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # R-009, constitution Principle V: one JSON object per request. $uri is the path without its query
    # string; no header or body is logged. "upstream" names the instance that answered, which is how a
    # maintainer sees the load being spread (SC-003).
    log_format main_json escape=json
        '{"time":"$time_iso8601","method":"$request_method","uri":"$uri","status":$status,'
        '"upstream":"$upstream_addr","upstream_status":"$upstream_status","request_time":$request_time}';
    access_log /dev/stdout main_json;

    # R-002: Docker's embedded DNS. Names are re-resolved every 5 seconds, so an instance added with
    # `--scale` joins, and a stopped one leaves, without this file being edited or nginx reloaded (FR-016).
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Every address Docker returns for a service name is a member. Round robin is the default, and no
    # affinity is needed: run state lives in PostgreSQL and the frontend is static files.
    # max_fails=1 fail_timeout=10s: one failed attempt takes an instance out of rotation for 10 seconds
    # (FR-012, SC-006).
    upstream backend {
        zone backend 64k;
        server backend:8080 resolve max_fails=1 fail_timeout=10s;
    }

    upstream frontend {
        zone frontend 64k;
        server frontend:8080 resolve max_fails=1 fail_timeout=10s;
    }

    server {
        listen 8080;

        # The balancer's own health check, for its container. Instance health endpoints are never routed.
        location = /lb-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # R-003: a dead instance fails in 2 seconds and the attempt moves to the next one. Reads may take
        # 75 seconds, longer than the 45-second model timeout, so the application's own timeout decides a
        # slow run, never this balancer (FR-014). nginx never resends a POST that already reached an
        # instance, so a retry cannot start the same run twice.
        proxy_connect_timeout 2s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # FR-008: the API goes to the backend instances, path unchanged.
        location /api/ {
            proxy_pass http://backend;
            error_page 502 503 504 = @backend_unavailable;
        }

        # FR-008: everything else goes to the frontend instances, which return the application for any path.
        location / {
            proxy_pass http://frontend;
            error_page 502 503 504 = @frontend_unavailable;
        }

        # FR-013: no instance of a half answered. Same shape as the backend's own problem responses, so the
        # frontend's error handling reads it unchanged.
        location @backend_unavailable {
            default_type application/json;
            return 502 '{"title":"Service unavailable","status":502,"detail":"No backend instance is available. Check `docker compose -f compose.stack.yaml ps` and the backend logs."}';
        }

        location @frontend_unavailable {
            default_type text/html;
            return 502 '<!doctype html><title>Unavailable</title><h1>The application is unavailable</h1><p>No frontend instance is running. Check <code>docker compose -f compose.stack.yaml ps</code>.</p>';
        }
    }
}
