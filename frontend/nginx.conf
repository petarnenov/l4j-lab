# R-005: one frontend instance. Serves the built application on 8080 as the unprivileged nginx user.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # FR-019: readiness for the compose health check. Not routed by the load balancer.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints every file under assets/, so a changed file has a new name and can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html names the current asset files, so it must never be served stale.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # FR-007: any other path returns the application rather than a 404. The application switches screens
    # in memory, so there are no per-screen files to find.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
