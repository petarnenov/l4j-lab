# The legacy billing API. Settings are environment variables with documented defaults (R-012).
micronaut:
  application:
    name: legacy-billing-api
  server:
    port: ${LEGACY_PORT:8080}
datasources:
  default:
    url: ${DATASOURCE_URL:`jdbc:postgresql://postgres:5432/l4j`}
    username: ${DATASOURCE_USER:l4j}
    password: ${DATASOURCE_PASSWORD:l4j}
    driver-class-name: org.postgresql.Driver
    schema-generate: NONE
flyway:
  datasources:
    default:
      enabled: true
      # The schema this service owns. The MCP server migrates its own, separately.
      schemas: legacy_billing
      default-schema: legacy_billing
legacy:
  issuer-url: ${MCP_ISSUER_URL:`http://token-issuer:8080`}
  # R-012: unset means a random duration in [30s, 90s], which is FR-024 exactly. The topology suite
  # sets it to a few seconds so `make mcp-verify` does not spend minutes waiting.
  run-duration-ms: ${LEGACY_RUN_DURATION_MS:-1}
endpoints:
  health:
    enabled: true
    details-visible: ANONYMOUS

# An empty collection is a fact. Serde's default omits one, so a page with no results went out as
# {"totalCount":0} — which made "nothing matched" and "malformed response" the same bytes, and the MCP
# server dereferenced the absent field. An ordinary query — a date range with no runs in it — answered
# HTTP 500 (feature 010, research R-001).
jackson:
  serialization-inclusion: ALWAYS
