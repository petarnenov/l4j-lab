micronaut:
  application:
    name: financial-agent-chain
  server:
    port: 8080
  executors:
    blocking:
      type: fixed
      n-threads: 8

# T007 / FR-016, FR-017, FR-019: the whole configuration surface for the model, bound to
# environment variables with documented defaults. Switching provider is a config change only.
l4j:
  model:
    provider: ${L4J_PROVIDER:local}
    base-url: ${L4J_MODEL_BASE_URL:`http://localhost:11434`}
    model-id: ${L4J_MODEL_ID:`llama3.2`}
    api-key: ${OLLAMA_API_KEY:``}
    timeout-seconds: ${L4J_MODEL_TIMEOUT_SECONDS:45}

datasources:
  default:
    url: ${DATASOURCE_URL:`jdbc:postgresql://localhost:5432/l4j`}
    username: ${DATASOURCE_USER:l4j}
    password: ${DATASOURCE_PASSWORD:l4j}
    driver-class-name: org.postgresql.Driver
    dialect: POSTGRES
    schema-generate: NONE

flyway:
  datasources:
    default:
      enabled: true
      locations: classpath:db/migration
