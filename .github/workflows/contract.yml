# The contract between the halves: the committed frontend types must match the backend's OpenAPI
# description, and package.json must carry the application version. Runs on a change to either half,
# because a narrower filter can miss a type reached indirectly.
# See specs/003-monorepo-integration/contracts/ci-workflows.md for the path sets.
name: contract

on:
  push:
    paths:
      - backend/**
      - frontend/**
      - settings.gradle.kts
      - gradle/**
      - gradlew
      - gradlew.bat
      - .github/workflows/**
  pull_request:
    paths:
      - backend/**
      - frontend/**
      - settings.gradle.kts
      - gradle/**
      - gradlew
      - gradlew.bat
      - .github/workflows/**

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :frontend:checkApi :frontend:checkVersion
