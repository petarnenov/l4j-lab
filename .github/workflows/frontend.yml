# The frontend suite, run with npm directly so no JDK is installed just to run Vitest (FR-016 allows the
# per-half commands). See specs/003-monorepo-integration/contracts/ci-workflows.md for the path sets.
name: frontend

on:
  push:
    paths:
      - frontend/**
      - settings.gradle.kts
      - gradle/**
      - gradlew
      - gradlew.bat
      - .github/workflows/**
  pull_request:
    paths:
      - frontend/**
      - settings.gradle.kts
      - gradle/**
      - gradlew
      - gradlew.bat
      - .github/workflows/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
